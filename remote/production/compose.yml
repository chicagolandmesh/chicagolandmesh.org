networks:
  main:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy-cloudflare
    user: 1000:1000
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./config/caddy:/etc/caddy
      - ./site:/srv
      - ./logs:/logs
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DISCORD_INVITE_URL=${DISCORD_INVITE_URL}
      - PLAUSIBLE_JS=${PLAUSIBLE_JS}
      - PLAUSIBLE_ADDR=${PLAUSIBLE_ADDR}
      - MESHVIEW_ADDR=${MESHVIEW_ADDR}
      - CORESCOPE_ADDR=${CORESCOPE_ADDR}
      - MESHCORE_LIVE_MAP_ADDR=${MESHCORE_LIVE_MAP_ADDR}
      - MQTT_ADDR=${MQTT_ADDR}
    networks:
      - main
    restart: unless-stopped

  map-api:
    image: map-api
    expose:
      - 8080
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      - DSN=/data/data.db
      - LOG_PATH=/logs/api.log
      - TOKEN_SECRET=${TOKEN_SECRET}
      - CLIENT_ID=${DISCORD_CLIENT_ID}
      - CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - REDIRECT_URL=${DISCORD_CALLBACK_URL}
    networks:
      - main
    restart: unless-stopped

  pmtiles:
    image: protomaps/go-pmtiles
    expose:
      - 8080
    command: >
      serve /map
      --quiet
      --public-url ${TILES_URL}
    volumes:
      - ./data/midwest.pmtiles:/map/midwest.pmtiles
      - ./data/globe.pmtiles:/map/globe.pmtiles
    networks:
      - main
    restart: unless-stopped

  hashicon:
    image: hashicon
    expose:
      - 3000
    networks:
      - main
    restart: unless-stopped
